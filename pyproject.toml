[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "norman-reactor"
version = "1.0.0"
description = "Physics-grounded benchmark for AI control of nuclear reactor load-following"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Isa Maharramov" }]
keywords = [
    "nuclear", "reactor", "pwr", "load-following", "point-kinetics", "xenon",
    "reinforcement-learning", "safe-rl", "control", "gymnasium", "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=0.29",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
rl = ["torch>=2.2"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/IsaMaharramov/Norman-The-Machine"

[project.scripts]
norman-evaluate = "norman.evaluate:main"
norman-run = "norman.run:main"

[tool.scikit-build]
wheel.packages = ["norman"]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
minimum-version = "build-system.requires"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running verification tests"]
